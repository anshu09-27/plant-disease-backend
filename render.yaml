services:
  - type: web
    name: plant-disease-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: model/plant_disease_model.tflite
      - key: IMG_SIZE
        value: 224
    plan: free
